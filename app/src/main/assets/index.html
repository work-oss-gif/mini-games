<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Sunny Acres</title>
<style>
:root{--panel:#ffffffe6;--text:#1b1d21;--muted:#5b6170;--accent:#2f8f3a;--btn:#eef1f4;--sel:#ffd54a;--warn:#c0392b}
:root[data-theme="dark"]{--panel:#1c1f24e6;--text:#e8eaed;--muted:#9aa1ad;--accent:#5cc06a;--btn:#2a2f36;--sel:#b8901a;--warn:#ff7b6b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--panel:#1c1f24e6;--text:#e8eaed;--muted:#9aa1ad;--accent:#5cc06a;--btn:#2a2f36;--sel:#b8901a;--warn:#ff7b6b}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#121417;font-family:system-ui,sans-serif;color:var(--text)}
canvas{display:block;touch-action:none}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:6px;justify-content:space-between;pointer-events:none}
.chip{background:var(--panel);border-radius:14px;padding:6px 10px;font-weight:700;font-size:15px;box-shadow:0 2px 6px #0003}
#bar{position:fixed;bottom:8px;left:8px;right:8px;display:flex;gap:6px;overflow-x:auto;background:var(--panel);padding:6px;border-radius:16px;box-shadow:0 2px 8px #0004}
#bar button{flex:0 0 auto;min-width:64px;border:0;border-radius:12px;background:var(--btn);color:var(--text);padding:6px 8px;font-size:13px;font-weight:600}
#bar button.on{background:var(--sel);color:#1b1d21}
#bar button b{display:block;font-size:22px}
#toast{position:fixed;top:52px;left:50%;transform:translateX(-50%);background:var(--panel);padding:8px 14px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .3s;pointer-events:none;text-align:center;max-width:90%}
#modal{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center}
#modal .box{background:var(--panel);border-radius:18px;padding:16px;width:min(340px,92%);max-height:80%;overflow:auto}
#modal h2{margin:0 0 8px}
#modal .row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid #8883}
#modal button{border:0;border-radius:10px;background:var(--accent);color:#fff;padding:8px 12px;font-weight:700}
#modal button:disabled{opacity:.4}
.muted{color:var(--muted);font-size:13px}
.fl{position:fixed;transform:translate(-50%,-50%);font-weight:800;font-size:22px;color:#fff;text-shadow:0 2px 0 #0008,0 0 6px #0006;pointer-events:none;animation:rise 1.1s ease-out forwards}
@keyframes rise{0%{opacity:0;margin-top:10px;font-size:10px}20%{opacity:1;font-size:26px}100%{opacity:0;margin-top:-80px}}
.chip.pop{animation:pop .35s}
@keyframes pop{40%{transform:scale(1.25)}}
#bar button{transition:transform .08s}#bar button:active,#modal button:active{transform:scale(.9)}
#bar button.on{box-shadow:0 0 0 2px #fff8 inset;transform:translateY(-3px)}
#modal .box{animation:pop .25s}
</style>
</head>
<body>
<div id="top"><span class="chip" id="coins">🪙 0</span><span class="chip" id="lvl">⭐ Lv 1</span></div>
<div id="toast"></div>
<div id="bar"></div>
<div id="modal"><div class="box" id="mbox"></div></div>
<script src="three.min.js"></script>
<script>
// ===== Game data =====
const CROPS={
  wheat:{name:'Wheat',icon:'🌾',cost:2,sell:5,time:20,xp:1,lvl:1,color:0xe8c547},
  carrot:{name:'Carrot',icon:'🥕',cost:5,sell:12,time:45,xp:2,lvl:2,color:0xf08a24},
  corn:{name:'Corn',icon:'🌽',cost:10,sell:26,time:90,xp:4,lvl:3,color:0xf5e04a},
  pumpkin:{name:'Pumpkin',icon:'🎃',cost:20,sell:55,time:180,xp:8,lvl:5,color:0xe0701c}
};
const EGG={name:'Egg',icon:'🥚',sell:15,time:60,xp:2};
const GRID=6, TILE=2;
const KEY='sunnyacres_v1';
let S={coins:30,xp:0,plots:{},owned:[],barn:{},coop:false,hens:[],tool:'wheat'};
function load(){try{const t=localStorage.getItem(KEY);if(t)S=Object.assign(S,JSON.parse(t));}catch(e){}
  if(!S.owned.length){for(let x=2;x<4;x++)for(let z=2;z<4;z++)S.owned.push(x+','+z);} }
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
load();
const level=()=>1+Math.floor(Math.sqrt(S.xp/5));
const now=()=>Date.now()/1000;
const plotPrice=()=>20*Math.pow(1.35,S.owned.length-4)|0;

// ===== Theme =====
function isDarkPage(){const a=document.documentElement.getAttribute('data-theme');
  if(a)return a==='dark';return matchMedia('(prefers-color-scheme:dark)').matches;}

// ===== 3D scene =====
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(45,1,0.1,200);
const hemi=new THREE.HemisphereLight(0xffffff,0x557744,0.7);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xfff2d6,0.9);sun.position.set(12,20,8);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20});scene.add(sun);
function applyTheme(){const d=isDarkPage();
  const sky=d?0x1a2340:0x9fd8f5;scene.background=new THREE.Color(sky);scene.fog=new THREE.Fog(sky,40,90);
  hemi.intensity=d?0.45:0.75;sun.intensity=d?0.45:0.95;sun.color.set(d?0x9db4ff:0xfff2d6);
  lamps.forEach(l=>l.visible=d);}
window.setTheme=t=>{document.documentElement.setAttribute('data-theme',t);applyTheme();};

const M=c=>new THREE.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>{const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M(c));m.castShadow=m.receiveShadow=true;return m;};
// grass ground
const ground=new THREE.Mesh(new THREE.CircleGeometry(45,48),M(0x6cbf4a));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const off=-(GRID*TILE)/2+TILE/2;
const tpos=(x,z)=>new THREE.Vector3(off+x*TILE,0,off+z*TILE);
// plots
const plotMesh={},cropMesh={},signMesh={};
for(let x=0;x<GRID;x++)for(let z=0;z<GRID;z++){
  const k=x+','+z;const p=box(TILE*0.92,0.2,TILE*0.92,0x8b5a2b);p.position.copy(tpos(x,z));p.position.y=0.1;
  p.userData={type:'plot',k};scene.add(p);plotMesh[k]=p;
  for(let i=-1;i<=1;i++){const f=box(TILE*0.8,0.08,0.22,0x744a22);f.position.set(0,0.12,i*0.55);f.userData=p.userData;p.add(f);}}
const kpos=k=>tpos(...k.split(',').map(Number));
// barn (sell building)
const barn=new THREE.Group();
const bBody=box(4,3,3,0xb8322a);bBody.position.y=1.5;barn.add(bBody);
const roof=new THREE.Mesh(new THREE.ConeGeometry(3.2,1.8,4),M(0x6b3b1f));roof.position.y=3.9;roof.rotation.y=Math.PI/4;roof.scale.z=0.75;roof.castShadow=true;barn.add(roof);
const door=box(1.4,1.9,0.1,0xf2e6c9);door.position.set(0,0.95,1.52);barn.add(door);
barn.position.set(-10,0,-3);barn.rotation.y=Math.PI/2;barn.traverse(o=>o.userData={type:'barn'});scene.add(barn);
// coop
const coop=new THREE.Group();
const cB=box(2.6,1.6,2,0xf0d9a8);cB.position.y=0.8;coop.add(cB);
const cR=box(3,0.25,2.4,0x7a4a2a);cR.position.y=1.75;coop.add(cR);
const fence=[];for(let i=0;i<16;i++){const a=i/16*Math.PI*2;const f=box(0.15,0.8,0.15,0xd8c39a);f.position.set(Math.cos(a)*3.5,0.4,Math.sin(a)*3.5);coop.add(f);}
coop.position.set(10,0,4);coop.traverse(o=>o.userData={type:'coop'});scene.add(coop);
// trees and lamps
const lamps=[];
const anim=[]; // small functions that run every frame: (time, dt)
const ball=(r,c)=>{const m=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),M(c));m.castShadow=true;return m;};
function tree(x,z,s){const g=new THREE.Group();
  const t=new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.32,1.5,8),M(0x7a4a26));t.position.y=0.75;t.castShadow=true;g.add(t);
  const top=new THREE.Group();top.position.y=1.4;g.add(top);
  [[0,0.8,0,1.15,0x4fae45],[0.7,0.5,0.2,0.8,0x45a03c],[-0.6,0.55,-0.3,0.85,0x5aba4e],[0.1,1.5,0,0.75,0x66c658]].forEach(([a,b,c,r,col])=>{const l=ball(r,col);l.position.set(a,b,c);top.add(l);});
  for(let i=0;i<4;i++){const a=ball(0.13,0xe53935);a.position.set(Math.cos(i*1.9)*0.95,0.6+i*0.25,Math.sin(i*1.9)*0.95);top.add(a);}
  g.position.set(x,0,z);g.scale.setScalar(s);scene.add(g);
  anim.push(t=>{top.rotation.z=Math.sin(t*1.1+x)*0.04;top.rotation.x=Math.cos(t*0.9+z)*0.03;});}
[[-14,10,1.2],[-16,-9,1],[14,-10,1.3],[16,12,0.9],[0,-15,1.1],[-6,15,1],[7,15,1.2],[-18,2,1]].forEach(a=>tree(...a));
[[-7,-7],[7,-7],[-7,7],[7,7]].forEach(([x,z])=>{const p=box(0.2,2.4,0.2,0x333333);p.position.set(x,1.2,z);scene.add(p);
  const b=new THREE.Mesh(new THREE.SphereGeometry(0.3,8,8),new THREE.MeshBasicMaterial({color:0xffd780}));b.position.set(x,2.5,z);scene.add(b);
  const L=new THREE.PointLight(0xffc870,1,12);L.position.set(x,2.5,z);scene.add(L);lamps.push(L,b);});

// ----- scenery: path, pond with duck, windmill, fence, hay, flowers, butterflies -----
const flat=(r,c,y)=>{const m=new THREE.Mesh(new THREE.CircleGeometry(r,28),M(c));m.rotation.x=-Math.PI/2;m.position.y=y;m.receiveShadow=true;scene.add(m);return m;};
[[-15,-14,5],[13,14,6],[-3,17,4],[18,-2,5],[-19,8,4]].forEach(([x,z,r])=>flat(r,0x7bcb55,0.01).position.set(x,0.01,z));
const path=box(3.4,0.06,1.7,0xdcbb7e);path.position.set(-7.6,0.03,-3);scene.add(path);
flat(3.5,0xe3cf9a,0.02).position.set(10,0.02,-8);
const water=new THREE.Mesh(new THREE.CircleGeometry(3,28),new THREE.MeshLambertMaterial({color:0x4fb4e8,transparent:true,opacity:0.9}));
water.rotation.x=-Math.PI/2;water.position.set(10,0.04,-8);scene.add(water);
const duck=new THREE.Group();{const b=ball(0.3,0xffe45c);b.scale.set(1.2,0.8,1);b.position.y=0.18;duck.add(b);
  const h=ball(0.18,0xffe45c);h.position.set(0.28,0.45,0);duck.add(h);const bk=box(0.16,0.06,0.12,0xff9800);bk.position.set(0.47,0.42,0);duck.add(bk);scene.add(duck);}
anim.push(t=>{const a=t*0.35;duck.position.set(10+Math.cos(a)*1.6,0.04+Math.sin(t*3)*0.02,-8+Math.sin(a)*1.6);duck.rotation.y=-a-Math.PI/2;
  water.material.color.setHSL(0.56,0.75,(isDarkPage()?0.3:0.6)+Math.sin(t*1.5)*0.02);});
const mill=new THREE.Group();{const tw=new THREE.Mesh(new THREE.CylinderGeometry(0.8,1.4,5,10),M(0xf3ead7));tw.position.y=2.5;tw.castShadow=true;mill.add(tw);
  const cap=new THREE.Mesh(new THREE.ConeGeometry(1.1,1.2,10),M(0xc0392b));cap.position.y=5.6;cap.castShadow=true;mill.add(cap);
  const d=box(0.7,1.2,0.1,0x7a4a26);d.position.set(0,0.6,1.3);mill.add(d);
  const hub=new THREE.Group();hub.position.set(0,4.6,1.05);mill.add(hub);hub.add(ball(0.25,0x7a4a26));
  for(let i=0;i<4;i++){const arm=new THREE.Group();const bl=box(0.5,2.8,0.06,0xfff7e6);bl.position.y=1.6;arm.add(bl);arm.rotation.z=i*Math.PI/2;hub.add(arm);}
  mill.position.set(-11,0,9);mill.rotation.y=0.9;scene.add(mill);anim.push((t,dt)=>{hub.rotation.z-=dt*1.2;});}
{const F=7.4;for(let s=0;s<4;s++){const g=new THREE.Group();g.rotation.y=s*Math.PI/2;
  for(let i=-3;i<=3;i++){if(s===3&&i===-2)continue;const p=box(0.18,0.9,0.18,0xf5efe0);p.position.set(i*2.1,0.45,F);g.add(p);}
  [0.35,0.7].forEach(y=>{const r=box(s===3?8.3:F*2,0.1,0.08,0xf5efe0);r.position.set(s===3?2.1:0,y,F);g.add(r);});scene.add(g);}}
[[-12.5,-6.5],[-13.2,-5.2],[-12.6,-5.8,1]].forEach(([x,z,up])=>{const h=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,1,14),M(0xe9c85a));h.rotation.z=Math.PI/2;h.position.set(x,up?1.55:0.6,z);h.castShadow=true;scene.add(h);});
{let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;const cols=[0xff6fa5,0xffd54a,0xffffff,0xb388ff,0xff8a50];
  for(let i=0;i<46;i++){const a=rnd()*6.283,r=10+rnd()*20,x=Math.cos(a)*r,z=Math.sin(a)*r;
    if(Math.hypot(x-10,z+8)<4||Math.hypot(x+10,z+3)<4||Math.hypot(x-10,z-4)<4.5||Math.hypot(x+11,z-9)<2.5)continue;
    const st=box(0.05,0.35,0.05,0x3f8f2f);st.position.set(x,0.17,z);st.castShadow=false;scene.add(st);
    const f=ball(0.13,cols[i%5]);f.castShadow=false;f.position.set(x,0.4,z);scene.add(f);}}
for(let i=0;i<5;i++){const b=new THREE.Group(),mat=new THREE.MeshBasicMaterial({color:[0xff9ed2,0xfff59d,0x9be7ff,0xffb74d,0xe1bee7][i],side:THREE.DoubleSide});
  const w1=new THREE.Mesh(new THREE.PlaneGeometry(0.28,0.22),mat),w2=w1.clone();w1.position.x=0.14;w2.position.x=-0.14;
  const p1=new THREE.Group(),p2=new THREE.Group();p1.add(w1);p2.add(w2);b.add(p1,p2);scene.add(b);
  const cx=(i-2)*5,cz=i%2?9:-9;
  anim.push(t=>{const a=t*0.5+i*2;b.position.set(cx+Math.cos(a)*3,1.6+Math.sin(t*2+i)*0.5,cz+Math.sin(a*1.3)*3);b.rotation.y=-a;
    const fl=Math.sin(t*14+i)*0.9;p1.rotation.z=fl;p2.rotation.z=-fl;});}

// ----- particles and floating text (harvest effects) -----
const parts=[],pGeo=new THREE.SphereGeometry(0.1,6,5);
function burst(pos,color,n){for(let i=0;i<(n||14);i++){const m=new THREE.Mesh(pGeo,new THREE.MeshBasicMaterial({color,transparent:true}));
  m.position.copy(pos);m.position.y+=0.6;const a=Math.random()*6.283,sp=1+Math.random()*2.2;
  m.userData={vx:Math.cos(a)*sp,vy:3+Math.random()*3,vz:Math.sin(a)*sp,life:0.8};scene.add(m);parts.push(m);}}
function updateParts(dt){for(let i=parts.length-1;i>=0;i--){const m=parts[i],u=m.userData;u.vy-=12*dt;
  m.position.x+=u.vx*dt;m.position.y+=u.vy*dt;m.position.z+=u.vz*dt;u.life-=dt;m.material.opacity=Math.max(0,u.life/0.8);
  if(u.life<=0){scene.remove(m);m.material.dispose();parts.splice(i,1);}}}
function floatText(txt,pos){const v=pos.clone();v.y+=1.2;v.project(cam);const d=document.createElement('div');d.className='fl';d.textContent=txt;
  d.style.left=((v.x+1)/2*innerWidth)+'px';d.style.top=((1-v.y)/2*innerHeight)+'px';document.body.appendChild(d);setTimeout(()=>d.remove(),1100);}

// ----- crop models: each plant is its own little group so it can sway -----
function makeCrop(type){const c=CROPS[type],g=new THREE.Group();
  const n=type==='pumpkin'?4:9,side=type==='pumpkin'?2:3;
  for(let i=0;i<n;i++){const pl=new THREE.Group();
    pl.position.set(((i%side)-(side-1)/2)*(1.5/side)+(i%2?0.05:-0.05),0,(Math.floor(i/side)-(side-1)/2)*(1.5/side));
    const leaf=(w,h,y,rz,ry)=>{const l=ball(0.5,0x4caf50);l.scale.set(w,h,0.06);l.position.y=y;l.rotation.set(0,ry||0,rz);l.castShadow=false;pl.add(l);return l;};
    if(type==='wheat'){const s=box(0.05,0.8,0.05,0xb8c24a);s.position.y=0.4;pl.add(s);
      const h=ball(0.11,c.color);h.scale.set(1,2.6,1);h.position.y=0.95;pl.add(h);leaf(0.12,0.5,0.35,0.6);leaf(0.12,0.5,0.3,-0.6);}
    else if(type==='carrot'){for(let j=0;j<4;j++)leaf(0.14,0.75,0.35,(j%2?0.45:-0.45),j*0.8);
      const top=new THREE.Mesh(new THREE.ConeGeometry(0.15,0.3,8),M(c.color));top.rotation.x=Math.PI;top.position.y=0.08;pl.add(top);}
    else if(type==='corn'){const s=box(0.09,1.3,0.09,0x4c9a34);s.position.y=0.65;pl.add(s);
      leaf(0.14,0.8,0.6,0.8);leaf(0.14,0.8,0.8,-0.8,1);const cob=ball(0.13,c.color);cob.scale.set(1,2.2,1);cob.position.set(0.14,0.85,0);pl.add(cob);}
    else{const p=ball(0.36,c.color);p.scale.set(1.15,0.8,1.15);p.position.y=0.28;pl.add(p);
      const st=box(0.07,0.18,0.07,0x3f8f2f);st.position.y=0.62;pl.add(st);const l=leaf(0.5,0.3,0.1,0,i);l.rotation.x=Math.PI/2;l.position.x=0.4;}
    g.add(pl);}
  return g;}

// hens
const henObjs=[];
function makeHen(){const g=new THREE.Group();const b=new THREE.Mesh(new THREE.SphereGeometry(0.35,10,8),M(0xffffff));b.position.y=0.4;b.castShadow=true;g.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(0.2,8,8),M(0xffffff));h.position.set(0.3,0.7,0);g.add(h);
  const beak=new THREE.Mesh(new THREE.ConeGeometry(0.07,0.18,4),M(0xffa000));beak.rotation.z=-Math.PI/2;beak.position.set(0.52,0.68,0);g.add(beak);
  const comb=box(0.08,0.12,0.12,0xe53935);comb.position.set(0.3,0.92,0);g.add(comb);
  const egg=new THREE.Mesh(new THREE.SphereGeometry(0.16,8,8),M(0xfff3d6));egg.scale.y=1.3;egg.position.y=1.4;g.add(egg);g.userData.egg=egg;
  g.traverse(o=>{if(o!==g)o.userData={type:'hen',g};});
  g.userData.t=Math.random()*10;scene.add(g);return g;}
function syncHens(){coop.visible=S.coop;while(henObjs.length<S.hens.length)henObjs.push(makeHen());}

// ===== Camera control: drag to rotate, pinch to zoom =====
let yaw=0.7,pitch=0.9,dist=36;
function placeCam(){cam.position.set(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist,Math.cos(yaw)*Math.cos(pitch)*dist);cam.lookAt(0,0,0);}
const ptrs=new Map();let moved=0,pinch0=0,dist0=0;
const cv=renderer.domElement;
cv.addEventListener('pointerdown',e=>{ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});moved=0;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);dist0=dist;}});
cv.addEventListener('pointermove',e=>{const p=ptrs.get(e.pointerId);if(!p)return;
  const dx=e.clientX-p.x,dy=e.clientY-p.y;
  if(ptrs.size===1){yaw-=dx*0.006;pitch=Math.min(1.35,Math.max(0.35,pitch+dy*0.004));moved+=Math.abs(dx)+Math.abs(dy);}
  p.x=e.clientX;p.y=e.clientY;
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);dist=Math.min(45,Math.max(12,dist0*pinch0/d));moved=99;}});
const up=e=>{const wasTap=ptrs.size===1&&moved<10;ptrs.delete(e.pointerId);if(wasTap)tap(e.clientX,e.clientY);};
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',e=>ptrs.delete(e.pointerId));
cv.addEventListener('wheel',e=>{dist=Math.min(45,Math.max(12,dist+e.deltaY*0.02));});

// ===== Tapping things =====
const ray=new THREE.Raycaster(),v2=new THREE.Vector2();
function tap(x,y){v2.set(x/innerWidth*2-1,-(y/innerHeight)*2+1);ray.setFromCamera(v2,cam);
  const hits=ray.intersectObjects(scene.children,true);
  for(const h of hits){const u=h.object.userData;if(!u||!u.type)continue;
    if(u.type==='plot'||u.type==='crop')return tapPlot(u.k);
    if(u.type==='barn')return openBarn();
    if(u.type==='coop')return openShop();
    if(u.type==='hen')return tapHen(u.g);}
}
function tapPlot(k){
  if(!S.owned.includes(k)){const pr=plotPrice();
    if(S.coins>=pr){S.coins-=pr;S.owned.push(k);burst(kpos(k),0x8fd066,16);toast('New field bought for 🪙'+pr);}else toast('This field costs 🪙'+pr);return refresh();}
  const p=S.plots[k];
  if(p){const c=CROPS[p.type];
    if(now()-p.t>=c.time){S.barn[p.type]=(S.barn[p.type]||0)+2;S.xp+=c.xp;delete S.plots[k];burst(kpos(k),c.color,18);burst(kpos(k),0xffffff,6);floatText('+2 '+c.icon,kpos(k));}
    else toast(c.icon+' ready in '+Math.ceil(c.time-(now()-p.t))+'s');
    return refresh();}
  const c=CROPS[S.tool];
  if(level()<c.lvl)return toast(c.name+' unlocks at level '+c.lvl);
  if(S.coins<c.cost)return toast('Not enough coins. Sell crops at the barn!');
  S.coins-=c.cost;S.plots[k]={type:S.tool,t:now()};burst(kpos(k),0x8b5a2b,8);refresh();}
function tapHen(g){const i=henObjs.indexOf(g),h=S.hens[i];
  if(now()-h>=EGG.time){S.hens[i]=now();S.barn.egg=(S.barn.egg||0)+1;S.xp+=EGG.xp;burst(g.position,0xfff3d6,10);floatText('+1 🥚',g.position);}
  else toast('🐔 egg in '+Math.ceil(EGG.time-(now()-h))+'s');refresh();}

// ===== Menus =====
const modal=document.getElementById('modal'),mbox=document.getElementById('mbox');
modal.onclick=e=>{if(e.target===modal)closeModal();};
function closeModal(){modal.style.display='none';}
window.appBack=()=>{if(modal.style.display==='flex'){closeModal();return true;}return false;};
function itemInfo(k){return k==='egg'?EGG:CROPS[k];}
function openBarn(){let total=0,rows='';
  for(const k in S.barn){if(!S.barn[k])continue;const it=itemInfo(k),v=S.barn[k]*it.sell;total+=v;
    rows+=`<div class="row"><span>${it.icon} ${it.name} × ${S.barn[k]}</span><span>🪙 ${v}</span></div>`;}
  mbox.innerHTML=`<h2>🏠 Barn</h2>${rows||'<p class="muted">Empty. Harvest ripe crops (they glow) to fill it.</p>'}
   <p style="display:flex;gap:8px;justify-content:flex-end"><button onclick="closeModal()" style="background:var(--btn);color:var(--text)">Close</button>
   <button ${total?'':'disabled'} onclick="sellAll()">Sell all 🪙 ${total}</button></p>`;modal.style.display='flex';}
window.sellAll=()=>{let t=0;for(const k in S.barn){t+=S.barn[k]*itemInfo(k).sell;}S.barn={};S.coins+=t;toast('Sold for 🪙'+t);closeModal();refresh();};
function openShop(){const henCost=40+S.hens.length*25;
  mbox.innerHTML=`<h2>🐔 Coop</h2>
   ${S.coop?'':'<div class="row"><span>Build the coop</span><button onclick="buy(\'coop\')">🪙 60</button></div>'}
   <div class="row"><span>Buy a hen (${S.hens.length}/6)<br><span class="muted">Lays an egg every minute</span></span>
   <button ${S.coop&&S.hens.length<6?'':'disabled'} onclick="buy('hen')">🪙 ${henCost}</button></div>
   <p class="muted">Tap a hen with an egg above her head to collect it.</p>
   <p style="text-align:right"><button onclick="closeModal()">Done</button></p>`;modal.style.display='flex';}
window.buy=w=>{if(w==='coop'){if(S.coins<60)return toast('Need 🪙60');S.coins-=60;S.coop=true;}
  else{const c=40+S.hens.length*25;if(S.coins<c)return toast('Need 🪙'+c);S.coins-=c;S.hens.push(now()-EGG.time);}
  syncHens();refresh();openShop();};

// ===== Bottom bar =====
const bar=document.getElementById('bar');
function drawBar(){let h='';
  for(const k in CROPS){const c=CROPS[k],lock=level()<c.lvl;
    h+=`<button class="${S.tool===k?'on':''}" onclick="pick('${k}')"><b>${lock?'🔒':c.icon}</b>${lock?'Lv '+c.lvl:'🪙'+c.cost}</button>`;}
  h+=`<button onclick="openBarn()"><b>🏠</b>Barn</button><button onclick="openShop()"><b>🐔</b>Coop</button><button onclick="help()"><b>❓</b>Help</button>`;
  bar.innerHTML=h;}
window.pick=k=>{S.tool=k;drawBar();const c=CROPS[k];toast(`${c.icon} ${c.name}: grows in ${c.time}s, sells for 🪙${c.sell} each`);};
window.help=()=>{mbox.innerHTML=`<h2>How to play</h2><p>1. Pick a seed at the bottom, then tap a brown field to plant it.</p>
  <p>2. Wait until the crop glows, then tap it to harvest (you get 2).</p><p>3. Tap the red barn and sell your harvest for coins.</p>
  <p>4. Tap grey fields to buy more land. Build a coop and buy hens for eggs.</p><p>5. Level up to unlock carrots, corn and pumpkins.</p>
  <p class="muted">Drag to turn the camera, pinch to zoom. Crops keep growing while the app is closed.</p>
  <p style="text-align:right"><button onclick="closeModal()">Let's farm!</button></p>`;modal.style.display='flex';};
window.openBarn=openBarn;window.openShop=openShop;window.closeModal=closeModal;

let tt;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.style.opacity=1;clearTimeout(tt);tt=setTimeout(()=>t.style.opacity=0,1800);}
let lastLvl=level();
function refresh(){document.getElementById('coins').textContent='🪙 '+S.coins;
  const L=level();document.getElementById('lvl').textContent='⭐ Lv '+L;
  if(L>lastLvl){toast('🎉 Level '+L+'!');lastLvl=L;}drawBar();
  for(const k in plotMesh){const o=S.owned.includes(k),p=plotMesh[k];p.material.color.set(o?0x8b5a2b:0x7fcf5c);
    p.scale.y=o?1:0.35;p.position.y=o?0.1:0.035;p.children.forEach(f=>f.visible=o);}
  const ce=document.getElementById('coins');if(ce.dataset.v!==''+S.coins){ce.dataset.v=S.coins;ce.classList.remove('pop');void ce.offsetWidth;ce.classList.add('pop');}
  save();}

// ===== Update crops each frame =====
function updateCrops(time){for(const k in plotMesh){const p=S.plots[k];
  if(!p){if(cropMesh[k]){scene.remove(cropMesh[k]);delete cropMesh[k];}continue;}
  if(!cropMesh[k]||cropMesh[k].userData.type!==p.type){if(cropMesh[k])scene.remove(cropMesh[k]);
    const m=makeCrop(p.type);m.userData.type=p.type;m.position.copy(tpos(...k.split(',').map(Number)));m.position.y=0.2;
    m.traverse(o=>{if(o!==m)o.userData={type:'crop',k};});m.userData.born=time;m.userData.ph=Math.random()*6;scene.add(m);cropMesh[k]=m;}
  const c=CROPS[p.type],g=Math.min(1,(now()-p.t)/c.time),m=cropMesh[k],ripe=g>=1;
  // pop out of the ground with a bounce, then grow smoothly
  const age=(time-m.userData.born)/0.45,pop=age<1?age*(1+0.6*Math.sin(age*Math.PI)):1;
  const s=(0.3+0.7*g)*pop*(ripe?1+Math.sin(time*5)*0.04:1);
  m.scale.set(s,s*(ripe?1+Math.sin(time*5+1.5)*0.05:1),s);
  // sway in the wind
  m.children.forEach((pl,i)=>{pl.rotation.z=Math.sin(time*1.8+i*0.9+m.userData.ph)*(ripe?0.14:0.08);pl.rotation.x=Math.cos(time*1.3+i)*0.04;});
  if(ripe!==m.userData.ripe){m.userData.ripe=ripe;m.traverse(o=>{if(o.material&&o.material.emissive)o.material.emissive.set(ripe?0x3a2a00:0);});}
  if(ripe&&Math.random()<0.02){const q=kpos(k);q.x+=Math.random()-0.5;q.z+=Math.random()-0.5;burst(q,0xfff59d,1);}}}
function updateHens(time,dt){henObjs.forEach((g,i)=>{const d=g.userData;d.t+=dt;
  const a=d.t*0.4+i*1.7,r=1.5+Math.sin(d.t*0.3+i)*1,peck=Math.sin(d.t*0.9+i*2)>0.75;
  g.position.set(coop.position.x+Math.cos(a)*r,peck?0:Math.abs(Math.sin(d.t*7))*0.14,coop.position.z+Math.sin(a)*r);
  g.lookAt(coop.position.x+Math.cos(a+0.1)*r,g.position.y,coop.position.z+Math.sin(a+0.1)*r);g.rotateY(-Math.PI/2);
  g.rotateZ(peck?-0.5-Math.abs(Math.sin(d.t*12))*0.35:Math.sin(d.t*7)*0.06);
  d.egg.visible=now()-S.hens[i]>=EGG.time;d.egg.position.y=1.4+Math.sin(time*4)*0.1;});}

function resize(){renderer.setSize(innerWidth,innerHeight);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();}
addEventListener('resize',resize);resize();
applyTheme();syncHens();refresh();
try{if(!localStorage.getItem(KEY+'_seen')){localStorage.setItem(KEY+'_seen','1');help();}}catch(e){help();}
let last=performance.now();
function loop(t){const dt=Math.min(0.1,(t-last)/1000);last=t;placeCam();updateCrops(t/1000);updateHens(t/1000,dt);updateParts(dt);for(const f of anim)f(t/1000,dt);renderer.render(scene,cam);requestAnimationFrame(loop);}
requestAnimationFrame(loop);
setInterval(save,5000);
</script>
</body>
</html>
